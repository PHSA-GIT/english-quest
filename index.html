<script>
(() => {
'use strict';

const NOTE_KEY = 'englishQuestNotebook_v1';
const PET_KEY = 'englishQuestPets_v1';
const GAME_KEY = 'englishQuestA1_v1';

const $ = id => document.getElementById(id);
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

let notes = {
  dictionary: [],
  rules: [],
  diary: [],
  errors: [],
  speaking: [],
  reading: [],
  goals: []
};

try {
  notes = {...notes, ...JSON.parse(localStorage.getItem(NOTE_KEY) || '{}')};
} catch {}

let pet = {
  id: 'foxy',
  name: '',
  race: 'dragon',
  color: 'normal',
  accessory: 'none',
  bond: 0,
  happiness: 50,
  energy: 70,
  food: 60,
  personality: 'curious',
  habitat: 'forest',
  unlockedHabitats: ['forest'],
  spentXP: 0
};

try {
  pet = {...pet, ...JSON.parse(localStorage.getItem(PET_KEY) || '{}')};
} catch {}

pet.unlockedHabitats = Array.isArray(pet.unlockedHabitats)
  ? [...new Set(['forest', ...pet.unlockedHabitats])]
  : ['forest'];

pet.spentXP = Math.max(0, Number(pet.spentXP) || 0);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[c]));

function saveNotes() {
  try {
    localStorage.setItem(NOTE_KEY, JSON.stringify(notes));
  } catch {
    alert('Não foi possível salvar o caderno neste navegador.');
  }
}

function list(id, arr, renderer) {
  $(id).innerHTML = arr.length
    ? arr.slice().reverse().map((x, i) => `
      <div class="notebook-entry">
        ${renderer(x, arr.length - 1 - i)}
        <div style="margin-top:8px">
          <button class="small danger" data-remove="${id}"
            data-index="${arr.length - 1 - i}">Excluir</button>
        </div>
      </div>`).join('')
    : '<div class="empty">Nada anotado ainda. Adicione seu primeiro registro!</div>';
}

function renderNotes() {
  list('dictList', notes.dictionary, x =>
    `<strong>${esc(x.word)}</strong> — ${esc(x.meaning)}
     <div>${esc(x.example)}</div>
     <div class="mini-note">${esc(x.date)}</div>`);

  list('ruleList', notes.rules, x =>
    `<strong>${esc(x.title)}</strong>
     <div>${esc(x.text)}</div><em>${esc(x.example)}</em>`);

  list('diaryList', notes.diary, x =>
    `<strong>${esc(x.date)}</strong><div>${esc(x.text)}</div>`);

  list('errorList', notes.errors, x =>
    `<strong>Antes:</strong> ${esc(x.wrong)}
     <br><strong>Correção:</strong> ${esc(x.correct)}
     <div>${esc(x.why)}</div>`);

  list('speakList', notes.speaking, x =>
    `<strong>${esc(x.prompt)}</strong><div>${esc(x.answer)}</div>
     <div class="mini-note">${esc(x.date)}</div>`);

  list('readList', notes.reading, x =>
    `<strong>${esc(x.title)}</strong> — ${esc(x.pages)} página(s)
     <div>${esc(x.notes)}</div>
     <div class="mini-note">${esc(x.date)}</div>`);

  list('goalList', notes.goals, x =>
    `🎯 ${esc(x.text)} ${x.done ? '✓ Concluída' : ''}`);
}

['dictDate','diaryDate','speakDate','readDate'].forEach(id => {
  if ($(id)) $(id).value = today();
});

document.querySelectorAll('[data-page]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('[data-page]').forEach(x =>
      x.classList.toggle('active', x === b)
    );
    document.querySelectorAll('.notebook-page').forEach(x =>
      x.hidden = x.id !== 'page-' + b.dataset.page
    );
  });
});

$('addDict').addEventListener('click', () => {
  const word = $('dictWord').value.trim();
  if (!word) return alert('Digite a palavra em inglês.');

  notes.dictionary.push({
    word,
    meaning: $('dictMeaning').value.trim(),
    example: $('dictExample').value.trim(),
    date: $('dictDate').value || today()
  });

  saveNotes();
  renderNotes();
  ['dictWord','dictMeaning','dictExample'].forEach(id => $(id).value = '');
});

$('dictSearch').addEventListener('input', () => {
  const q = $('dictSearch').value.toLowerCase();
  document.querySelectorAll('#dictList .notebook-entry').forEach(e => {
    e.hidden = !e.textContent.toLowerCase().includes(q);
  });
});

$('addRule').addEventListener('click', () => {
  const title = $('ruleTitle').value.trim();
  if (!title) return alert('Dê um nome para a regra.');

  notes.rules.push({
    title,
    text: $('ruleText').value.trim(),
    example: $('ruleExample').value.trim()
  });

  saveNotes();
  renderNotes();
  ['ruleTitle','ruleText','ruleExample'].forEach(id => $(id).value = '');
});

$('saveDiary').addEventListener('click', () => {
  const text = $('diaryText').value.trim();
  if (!text) return alert('Escreva alguma coisa no diário.');

  notes.diary.push({date: $('diaryDate').value || today(), text});
  saveNotes();
  renderNotes();
  $('diaryText').value = '';
});

$('addError').addEventListener('click', () => {
  const wrong = $('errorWrong').value.trim();
  const correct = $('errorCorrect').value.trim();

  if (!wrong || !correct) {
    return alert('Preencha a frase original e a correção.');
  }

  notes.errors.push({
    wrong,
    correct,
    why: $('errorWhy').value.trim()
  });

  saveNotes();
  renderNotes();
  ['errorWrong','errorCorrect','errorWhy'].forEach(id => $(id).value = '');
});

$('addSpeak').addEventListener('click', () => {
  const prompt = $('speakPrompt').value.trim();
  const answer = $('speakAnswer').value.trim();

  if (!answer) return alert('Escreva sua resposta em inglês.');

  notes.speaking.push({
    prompt,
    answer,
    date: $('speakDate').value || today()
  });

  saveNotes();
  renderNotes();
  $('speakPrompt').value = '';
  $('speakAnswer').value = '';
});

$('addRead').addEventListener('click', () => {
  const title = $('readTitle').value.trim();
  if (!title) return alert('Digite o título da leitura.');

  notes.reading.push({
    title,
    pages: $('readPages').value || '0',
    date: $('readDate').value || today(),
    notes: $('readNotes').value.trim()
  });

  saveNotes();
  renderNotes();
  ['readTitle','readPages','readNotes'].forEach(id => $(id).value = '');
});

$('addGoal').addEventListener('click', () => {
  const text = $('goalText').value.trim();
  if (!text) return alert('Digite uma meta.');

  notes.goals.push({text, done:false});
  saveNotes();
  renderNotes();
  $('goalText').value = '';
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-remove]');

  if (b) {
    const map = {
      dictList:'dictionary',
      ruleList:'rules',
      diaryList:'diary',
      errorList:'errors',
      speakList:'speaking',
      readList:'reading',
      goalList:'goals'
    };

    const arr = notes[map[b.dataset.remove]];
    if (arr) {
      arr.splice(Number(b.dataset.index), 1);
      saveNotes();
      renderNotes();
    }
  }
});

$('exportNotes').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob(
    [JSON.stringify(notes, null, 2)],
    {type:'application/json'}
  ));

  const a = document.createElement('a');
  a.href = url;
  a.download = 'english-quest-caderno.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

$('importNotesBtn').addEventListener('click', () => $('importNotes').click());

$('importNotes').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;

  try {
    const v = JSON.parse(await f.text());

    for (const k of Object.keys(notes)) {
      if (Array.isArray(v[k])) notes[k] = v[k];
    }

    saveNotes();
    renderNotes();
    alert('Caderno importado!');
  } catch {
    alert('Arquivo JSON inválido.');
  }

  e.target.value = '';
});

function gameXP() {
  try {
    const st = JSON.parse(localStorage.getItem(GAME_KEY) || '{}');

    return Object.entries(st.days || {}).reduce((sum, [, d]) =>
      sum + Object.entries(d.completed || {}).reduce((s, [id, done]) => {
        if (!done) return s;

        const recorded = d.awardedXP?.[id];
        const mission = st.missions?.find(m => m.id === id);

        return s + (Number.isFinite(Number(recorded))
          ? Number(recorded)
          : Number(mission?.xp) || 0);
      }, 0), 0);
  } catch {
    return 0;
  }
}

function availableXP() {
  return Math.max(0, gameXP() - (Number(pet.spentXP) || 0));
}

function savePet() {
  try {
    localStorage.setItem(PET_KEY, JSON.stringify(pet));
  } catch {
    alert('Não foi possível salvar os dados do mascote.');
  }

  renderPetJourney();
}

function buyHabitat(id) {
  const habitat = habitats[id];

  if (!habitat) return false;
  if (pet.unlockedHabitats.includes(id)) return true;

  const balance = availableXP();

  if (balance < habitat.xp) {
    alert(`Você precisa de ${habitat.xp} XP disponíveis para comprar ${habitat.name}. Você tem ${balance} XP.`);
    return false;
  }

  if (!confirm(`Desbloquear ${habitat.name} por ${habitat.xp} XP? Depois da compra, ele ficará desbloqueado.`)) {
    return false;
  }

  pet.spentXP += habitat.xp;
  pet.unlockedHabitats.push(id);
  pet.habitat = id;
  savePet();
  alert(`${habitat.name} desbloqueado! 🎉`);
  return true;
}

function updateHabitatOptions() {
  const select = $('petHabitat');
  const current = pet.habitat || 'forest';

  select.innerHTML = Object.entries(habitats).map(([id, h]) => {
    const unlocked = pet.unlockedHabitats.includes(id);
    const label = unlocked
      ? `${h.emoji} ${h.name} · desbloqueado`
      : `${h.emoji} ${h.name} · ${h.xp} XP`;

    return `<option value="${id}">${esc(label)}</option>`;
  }).join('');

  select.value = current;
}

function renderPetJourney() {
  const xp = gameXP();
  const balance = availableXP();

  $('journeyXP').textContent = xp + ' XP';
  $('petXP').textContent = balance + ' XP disponíveis';
  $('petBond').textContent = 'Laço: ' + pet.bond;
  $('petBondNumber').textContent = pet.bond;

  const stageIndex = petStages.reduce((idx, st, i) =>
    xp >= st.xp ? i : idx, 0);

  const stage = petStages[stageIndex];
  const raceInfo = races[pet.race] || races.dragon;
  const accessory = accessories[pet.accessory] || accessories.none;

  pet.happiness = Math.max(0, Math.min(100, Number(pet.happiness ?? 50)));
  pet.energy = Math.max(0, Math.min(100, Number(pet.energy ?? 70)));
  pet.food = Math.max(0, Math.min(100, Number(pet.food ?? 60)));

  if (!pet.unlockedHabitats.includes(pet.habitat)) {
    pet.habitat = 'forest';
  }

  const habitat = habitats[pet.habitat] || habitats.forest;
  $('petStage').style.background = habitat.background;

  $('petPersonality').value = pet.personality || 'curious';
  $('petCustomName').value = pet.name || '';

  $('petHappyBar').style.width = pet.happiness + '%';
  $('petHappyText').textContent = pet.happiness + '/100';
  $('petEnergyBar').style.width = pet.energy + '%';
  $('petEnergyText').textContent = pet.energy + '/100';
  $('petFoodBar').style.width = pet.food + '%';
  $('petFoodText').textContent = pet.food + '/100';

  $('petBig').textContent =
    raceInfo.stages[stageIndex] + (accessory.emoji ? ' ' + accessory.emoji : '');

  const color = colors[pet.color || 'normal'];
  $('petBig').style.filter =
    (color && color !== 'none' ? color + ' ' : '') +
    'drop-shadow(4px 5px 0 #080d17)';

  $('petName').textContent = pet.name || stage.name;
  $('petStageLabel').textContent =
    stage.label + ' · ' + raceInfo.name + ' · ' + habitat.emoji;

  $('petRace').value = pet.race || 'dragon';
  $('petColor').value = pet.color || 'normal';

  updateHabitatOptions();

  const accessorySelect = $('petAccessory');
  const selectedAccessory = pet.accessory || 'none';

  [...accessorySelect.options].forEach(option => {
    const item = accessories[option.value] || accessories.none;
    const unlocked = balance >= item.xp;

    option.disabled = !unlocked;
    option.textContent = option.dataset.base || option.textContent;

    if (!option.dataset.base) {
      option.dataset.base = option.textContent;
    }

    if (!unlocked) {
      option.textContent = `${option.dataset.base} · bloqueado (${item.xp} XP)`;
    }
  });

  accessorySelect.value = selectedAccessory;

  const nextAccessory = Object.entries(accessories)
    .find(([id, item]) => id !== 'none' && balance < item.xp);

  $('petUnlockHint').textContent = nextAccessory
    ? `Próximo acessório: ${nextAccessory[1].emoji || '✨'} ${nextAccessory[1].xp} XP disponíveis · faltam ${nextAccessory[1].xp - balance} XP.`
    : '🏆 Todos os acessórios desbloqueados!';

  $('petMessage').dataset.defaultMessage =
    stage.msg + ` Personalidade: ${personalities[pet.personality] || personalities.curious}.`;

  const stops = [
    {name:'Vila A1',emoji:'🏡',xp:0,desc:'Suas primeiras palavras'},
    {name:'Floresta das Palavras',emoji:'🌳',xp:100,desc:'Descubra vocabulário novo'},
    {name:'Ponte da Gramática',emoji:'🌉',xp:250,desc:'Conecte frases e ideias'},
    {name:'Castelo da Leitura',emoji:'🏰',xp:500,desc:'Explore histórias em inglês'},
    {name:'Montanha da Fluência',emoji:'🏔️',xp:900,desc:'O topo da sua aventura'}
  ];

  const currentIndex = stops.reduce((idx, stop, i) =>
    xp >= stop.xp ? i : idx, 0);

  $('journeyStops').innerHTML = stops.map((stop, i) => `
    <div class="journey-stop ${xp >= stop.xp ? 'unlocked' : ''} ${i === currentIndex ? 'current' : ''}">
      <span class="stop-icon">${xp >= stop.xp ? stop.emoji : '🔒'}</span>
      <div>
        <strong>${stop.name}</strong>
        <div class="mini-note">${stop.desc}</div>
        <div class="mini-note">${xp >= stop.xp ? '✓ Desbloqueada' : stop.xp + ' XP necessários'}</div>
      </div>
    </div>`).join('');

  const next = stops.find(stop => xp < stop.xp);
  const prev = next
    ? (stops.filter(stop => stop.xp < next.xp).slice(-1)[0]?.xp || 0)
    : 900;

  $('journeyProgressFill').style.width =
    (next ? Math.max(0, Math.min(100, (xp - prev) / (next.xp - prev) * 100)) : 100) + '%';

  $('journeyProgressText').textContent = next
    ? `Próxima parada: ${next.name} · faltam ${next.xp - xp} XP`
    : '🏆 Você chegou ao topo da jornada!';
}

function spendXP(cost, actionName) {
  const balance = availableXP();

  if (balance < cost) {
    alert(`${actionName}: você precisa de ${cost} XP disponíveis, mas tem ${balance} XP. Complete mais missões para ganhar XP!`);
    return false;
  }

  pet.spentXP += cost;
  return true;
}

function petCare({cost, food=0, happiness=0, energy=0, bond=1, message, action}) {
  if (cost > 0 && !spendXP(cost, action)) return;

  pet.food = Math.max(0, Math.min(100, pet.food + food));
  pet.happiness = Math.max(0, Math.min(100, pet.happiness + happiness));
  pet.energy = Math.max(0, Math.min(100, pet.energy + energy));
  pet.bond = Math.max(0, Number(pet.bond) || 0) + bond;

  savePet();
  $('petMessage').textContent = message;
}

  const id = e.target.value;

  if (!pet.unlockedHabitats.includes(id)) {
    const bought = buyHabitat(id);
    if (!bought) {
      updateHabitatOptions();
      return;
    }
  }

  pet.habitat = id;
  savePet();
});

  petCare({

    food:25,

    energy:0,
    message:'Nhac nhac! Seu pet adorou o lanchinho 🍓 (-10 XP)',
    action:'Alimentar o mascote'

});

  if (pet.energy < 15) {
    $('petMessage').textContent = 'Seu pet precisa descansar antes de brincar. 🌙';
    return;
  }

  petCare({
    cost:15,
    food:-5,
    happiness:20,
    energy:-15,
    message:'Que diversão! Vocês brincaram juntos 🎾 (-15 XP)',
    action:'Brincar com o mascote'
  });
});

$('petStudyBtn').addEventListener('click', () => {
  if (pet.energy < 10) {
    $('petMessage').textContent = 'Seu pet precisa descansar um pouco antes de estudar. 🌙';
    return;
  }

  petCare({
    cost:10,
    food:-5,
    happiness:10,
    energy:-10,
    message:'Estudar com você deixa seu pet orgulhoso! 📚 (-10 XP)',
    action:'Estudar com o mascote'
  });
});

$('petCustomName').addEventListener('change', e => {
  pet.name = e.target.value.trim().slice(0, 18);
  savePet();
});

$('petPatBtn').addEventListener('click', () => {
  pet.bond = (Number(pet.bond) || 0) + 1;
  pet.happiness = Math.min(100, (Number(pet.happiness) || 50) + 8);

  savePet();
  $('petMessage').textContent = 'Carinho recebido! Seu mascote está feliz 💚';
});

renderNotes();
renderPetJourney();

window.addEventListener('focus', renderPetJourney);
window.addEventListener('storage', e => {
  if (e.key === GAME_KEY) renderPetJourney();
});

})();
</script>
